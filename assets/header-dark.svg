<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Akshaj Nadimpalli. BSCS at Georgia Tech, Software Engineering Intern at Travelers, Founder at Signifi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.82" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="m"><rect width="1200" height="280" fill="url(#fade)"/></mask>
    <clipPath id="r"><rect width="1200" height="280" rx="16"/></clipPath>
    <style>
      .n{font:700 56px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#f0f6fc;letter-spacing:-1.5px}
      .s{font:500 21px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#9198a1}
      .k{font:500 15px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#58a6ff;letter-spacing:2px}
      .dot{animation:p 2.4s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
      @media (prefers-reduced-motion:reduce){.dot{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)" mask="url(#m)"/>
    <!-- node graph motif: models wired into systems -->
    <g stroke="#30363d" stroke-width="1.5" fill="none">
      <path d="M880 90 L980 140 L1090 92 M980 140 L960 220 M980 140 L1080 200 M880 90 L860 180 L960 220 L1080 200"/>
    </g>
    <g fill="#161b22" stroke-width="2">
      <circle cx="880" cy="90" r="9" stroke="#58a6ff"/>
      <circle cx="1090" cy="92" r="9" stroke="#a371f7"/>
      <circle cx="860" cy="180" r="7" stroke="#30363d"/>
      <circle cx="960" cy="220" r="9" stroke="#58a6ff"/>
      <circle cx="1080" cy="200" r="7" stroke="#a371f7"/>
      <circle cx="980" cy="140" r="16" stroke="url(#acc)" stroke-width="3"/>
    </g>
    <circle class="dot" cx="980" cy="140" r="5" fill="url(#acc)"/>
    <rect x="64" y="68" width="40" height="4" rx="2" fill="url(#acc)"/>
    <text x="116" y="75" class="k">APPLIED AI · SYSTEMS · PRODUCT</text>
    <text x="62" y="148" class="n">Hi, I'm Akshaj Nadimpalli</text>
    <text x="64" y="196" class="s">BSCS @ Georgia Tech  ·  Software Engineering Intern @ Travelers  ·  Founder @ Signifi</text>
    <rect x="0.5" y="0.5" width="1199" height="279" rx="16" fill="none" stroke="#30363d"/>
  </g>
</svg>
